name: Website release gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Content integrity gate
        run: npm run check:content

      - name: Build
        run: npm run build
